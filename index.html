<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Web preview of the QuickGST Invoice Android app.">
  <title>QuickGST Invoice Preview</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    html, body { height: 100%; margin: 0; background: #f5f7fc; color: #172b4d; overflow: hidden; }
    #boot {
      position: fixed; inset: 0; display: grid; place-content: center; gap: 12px;
      text-align: center; font: 15px/1.5 Roboto, system-ui, sans-serif; color: #5b6b85; padding: 0 16px;
    }
    #boot strong { font-size: 20px; color: #172b4d; }
  </style>
</head>
<body>
  <div id="boot" role="status">
    <strong>QuickGST Invoice</strong>
    <span id="boot-status">Loading the preview… the first start can take a few seconds.</span>
    <span>Preview only: your data is saved in this browser.</span>
  </div>
  <script>
    // pdf.js is published beside the page; the PDF preview loads it from here.
    window.dartPdfJsBaseUrl = new URL('pdfjs/', document.baseURI).href;
    (function () {
      var boot = document.getElementById('boot');
      var status = document.getElementById('boot-status');
      var started = false;
      function hideBoot() {
        started = true;
        if (boot) boot.remove();
      }
      function show(message) {
        if (started || !status) return;
        status.textContent = message;
        status.style.color = '#a11d1d';
      }
      // Hide the loading note as soon as the app draws its first frame.
      window.addEventListener('flutter-first-frame', hideBoot);
      new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          setTimeout(hideBoot, 300);
        }
      }).observe(document.body, { childList: true, subtree: true });
      // Show why the app could not start instead of an endless spinner.
      window.addEventListener('error', function (e) {
        show('The app could not start: ' + (e.message || 'script error') +
          '. Try Chrome or Edge, and reload the page.');
      });
      window.addEventListener('unhandledrejection', function (e) {
        show('The app could not start: ' + (e.reason && e.reason.message || e.reason) +
          '. Try Chrome or Edge, and reload the page.');
      });
      if (typeof WebAssembly !== 'object') {
        show('This browser cannot run the preview (WebAssembly is off). Use Chrome, Edge or Firefox.');
      }
      setTimeout(function () {
        show('Still loading after 45 seconds. Check the internet connection, then reload. ' +
          'If it keeps happening, send a screenshot of this screen.');
      }, 45000);
    })();
  </script>
  <script>
    // ?reset=1 clears data saved by earlier preview visits, then starts fresh.
    (function () {
      function start() {
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.async = true;
        document.body.appendChild(script);
      }
      if (!/[?&]reset=1/.test(location.search)) return start();
      var jobs = [];
      try {
        if (indexedDB.databases) {
          jobs.push(indexedDB.databases().then(function (dbs) {
            return Promise.all(dbs.map(function (db) {
              return new Promise(function (done) {
                var req = indexedDB.deleteDatabase(db.name);
                req.onsuccess = req.onerror = req.onblocked = function () { done(); };
              });
            }));
          }));
        }
        if (navigator.storage && navigator.storage.getDirectory) {
          jobs.push(navigator.storage.getDirectory().then(async function (root) {
            for await (const name of root.keys()) {
              await root.removeEntry(name, { recursive: true }).catch(function () {});
            }
          }));
        }
      } catch (e) { /* start anyway */ }
      Promise.all(jobs).catch(function () {}).then(function () {
        history.replaceState(null, '', location.pathname);
        start();
      });
    })();
  </script>
</body>
</html>
